
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071323">
<title>A Bouquet Just For You ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  background: radial-gradient(ellipse at center, #193451, #0B1C30 55%, #050C17);
  color: white;
  font-family: 'DM Sans', sans-serif;
}

#scene {
  position: relative;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  isolation: isolate;
}

.glow {
  position: absolute;
  width: 450px;
  height: 450px;
  border-radius: 50%;
  background: #83B2DF;
  filter: blur(120px);
  opacity: .15;
  z-index: -1;
  animation: glow 6s ease-in-out infinite alternate;
}

@keyframes glow {
  from { transform: scale(.8); opacity: .08; }
  to { transform: scale(1.2); opacity: .2; }
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  color: #D5E9FC;
  animation: twinkle var(--duration) ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .1; transform: scale(.7); }
  to { opacity: .9; transform: scale(1.3); }
}

.content {
  width: min(100%, 680px);
  padding: 35px 20px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  z-index: 2;
}

.intro {
  color: #A9C9E8;
  font-size: 10px;
  letter-spacing: 5px;
  opacity: 0;
  animation: fadeIn 2s 1s forwards;
}

#bouquet {
  display: block;
  width: min(100%, 510px);
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 15px 35px #0008);
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.flower {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.flower.show {
  animation: bloom 1s ease forwards, sway 5s ease-in-out infinite 1s;
}

@keyframes bloom {
  from { opacity: 0; scale: .1; }
  to { opacity: 1; scale: 1; }
}

@keyframes sway {
  0%, 100% { rotate: -1.5deg; }
  50% { rotate: 1.5deg; }
}

.stem {
  stroke: #789E91;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
}

.stem.show {
  animation: grow 2s ease forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

.leaf {
  fill: #7FAD9E;
}

#ribbon {
  opacity: 0;
}

#ribbon.show {
  animation: fadeIn 1.5s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.message {
  width: 100%;
  opacity: 0;
  transform: translateY(15px);
  transition: 1.5s ease;
}

.message.show {
  opacity: 1;
  transform: translateY(0);
}

.recipient {
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 6vw, 46px);
  font-weight: 400;
  color: #D5E9FC;
  margin: 0 0 15px;
}

.personal {
  font-family: 'Playfair Display', serif;
  font-size: clamp(16px, 3.5vw, 21px);
  font-style: italic;
  line-height: 1.8;
  color: #E9F1FA;
  max-width: 520px;
  margin: 0 auto 20px;
}

.sender {
  color: #A9C9E8;
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

.song-credit {
  color: #A9C9E8;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 12px;
}

.petal {
  position: fixed;
  pointer-events: none;
  color: #C9E3FA;
  z-index: 1;
  animation: drift linear forwards;
}

@keyframes drift {
  0% {
    opacity: 0;
    transform: translateY(0) rotate(0);
  }
  15% { opacity: .8; }
  100% {
    opacity: 0;
    transform: translate(var(--x), -110vh) rotate(300deg);
  }
}

@media(max-width: 480px) {
  .content {
    padding: 30px 14px 50px;
  }

  #bouquet {
    width: 112%;
    max-width: none;
  }

  .intro {
    font-size: 9px;
    letter-spacing: 3px;
  }

  .personal {
    max-width: 340px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div id="scene">

  <div class="glow"></div>
  <div class="stars" id="stars"></div>

  <main class="content">

    <div class="intro">A LITTLE SOMETHING FOR YOU</div>

    <svg id="bouquet" viewBox="0 0 600 610"
      xmlns="http://www.w3.org/2000/svg">

      <defs>

        <radialGradient id="bluePetal">
          <stop offset="0%" stop-color="#E5F2FF"/>
          <stop offset="65%" stop-color="#B7D5F2"/>
          <stop offset="100%" stop-color="#6D9FCE"/>
        </radialGradient>

        <radialGradient id="deepPetal">
          <stop offset="0%" stop-color="#E1F0FF"/>
          <stop offset="65%" stop-color="#91BCE5"/>
          <stop offset="100%" stop-color="#4779B2"/>
        </radialGradient>

        <radialGradient id="whitePetal">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#DCE8F3"/>
        </radialGradient>

        <linearGradient id="stemColor">
          <stop offset="0%" stop-color="#B1D4C1"/>
          <stop offset="100%" stop-color="#547E75"/>
        </linearGradient>

      </defs>

      <g id="stems"></g>

      <g id="leaves">
        <path class="leaf" d="M300 420 Q220 365 192 385 Q232 440 300 420"/>
        <path class="leaf" d="M302 390 Q360 330 410 345 Q370 405 302 390"/>
        <path class="leaf" d="M288 460 Q220 420 190 445 Q235 485 288 460"/>
        <path class="leaf" d="M315 440 Q390 390 435 410 Q390 460 315 440"/>
        <path class="leaf" d="M285 370 Q250 320 225 330 Q245 375 285 370"/>
      </g>

      <g id="flowers"></g>
      <g id="baby"></g>

      <g id="wrapping">
        <path d="M180 390 Q300 450 420 390 L365 570 Q300 590 235 570 Z"
          fill="#B5D2ED" opacity=".88"/>
        <path d="M180 390 Q300 450 420 390 L365 570 Q300 590 235 570 Z"
          fill="none" stroke="#E1EDFA" stroke-width="2"/>
      </g>

      <g id="ribbon">
        <path d="M300 465 C245 415 205 450 267 490 L300 472"
          fill="#83B2DF" stroke="#D5E9FC" stroke-width="2"/>
        <path d="M300 465 C355 415 395 450 333 490 L300 472"
          fill="#A9C9E8" stroke="#D5E9FC" stroke-width="2"/>
        <path d="M300 465 L278 540 L305 530 L322 470"
          fill="#7FAAD4" stroke="#D5E9FC" stroke-width="1.5"/>
        <circle cx="300" cy="465" r="9" fill="#E5EFF8"/>
      </g>

    </svg>

    <section class="message" id="message">

      <h1 class="recipient" id="recipient"></h1>

      <p class="personal" id="personal"></p>

      <div class="sender" id="sender"></div>

      <div class="song-credit">
        ♫ HANYA UNTUKMU — TEN 2 FIVE
      </div>

    </section>

  </main>
</div>

<!-- BACKGROUND MUSIC -->
<audio id="song" autoplay loop preload="auto">
  <source
    src="./Ten2Five%20-%20Hanya%20Untukmu%20(Official%20Audio%20Lyric).mp3"
    type="audio/mpeg">
</audio>

<script>

/* PERSONAL DETAILS */

const giftConfig = {
  recipient: "Someone Special",
  sender: "ALvinooo",
  message: "Real flowers may fade, but these will bloom forever. Made just for you. ♡"
};


/* FLOWER ARRANGEMENT */

const svgNS = "http://www.w3.org/2000/svg";

const flowers = [
  {type:"lily",x:160,y:170,color:"url(#bluePetal)",delay:2.2},
  {type:"rose",x:245,y:125,color:"url(#deepPetal)",delay:2.8},
  {type:"lily",x:340,y:105,color:"url(#bluePetal)",delay:3.4},
  {type:"rose",x:430,y:165,color:"url(#deepPetal)",delay:4},
  {type:"rose",x:115,y:265,color:"url(#bluePetal)",delay:4.5},
  {type:"daisy",x:210,y:250,color:"url(#whitePetal)",delay:5},
  {type:"rose",x:305,y:220,color:"url(#bluePetal)",delay:5.4},
  {type:"peony",x:390,y:270,color:"url(#whitePetal)",delay:5.8},
  {type:"lily",x:485,y:270,color:"url(#deepPetal)",delay:6.2},
  {type:"rose",x:180,y:335,color:"url(#deepPetal)",delay:6.6},
  {type:"daisy",x:280,y:330,color:"url(#whitePetal)",delay:7},
  {type:"rose",x:370,y:350,color:"url(#bluePetal)",delay:7.4}
];


function svgElement(name,attrs={}) {
  const el = document.createElementNS(svgNS,name);

  Object.entries(attrs).forEach(([key,value]) => {
    el.setAttribute(key,value);
  });

  return el;
}


function makeFlower(f) {

  const g = svgElement("g",{
    class:"flower",
    transform:`translate(${f.x} ${f.y})`
  });

  const count =
    f.type==="lily" ? 6 :
    f.type==="daisy" ? 12 :
    f.type==="peony" ? 18 : 10;

  for(let i=0;i<count;i++) {

    const angle = i*360/count;

    let rx,ry,fill;

    if(f.type==="lily") {
      rx=13; ry=33; fill=f.color;
    }
    else if(f.type==="daisy") {
      rx=7; ry=22; fill="url(#whitePetal)";
    }
    else if(f.type==="peony") {
      rx=12; ry=24; fill="url(#whitePetal)";
    }
    else {
      rx=12; ry=22;
      fill=i%2===0 ? f.color : "url(#bluePetal)";
    }

    g.appendChild(svgElement("ellipse",{
      cx:0,
      cy:-ry+5,
      rx,
      ry,
      fill,
      transform:`rotate(${angle})`,
      stroke:"#FFFFFF",
      "stroke-opacity":".2",
      "stroke-width":".8"
    }));
  }

  const centerColor =
    f.type==="daisy" ? "#E8DDA7" :
    f.type==="peony" ? "#F7F4EB" :
    f.type==="rose" ? "#91B8DD" : "#D8E9F7";

  g.appendChild(svgElement("circle",{
    cx:0,
    cy:0,
    r:f.type==="rose"?11:9,
    fill:centerColor,
    stroke:"#FFFFFF",
    "stroke-opacity":".5",
    "stroke-width":"1.5"
  }));

  if(f.type==="rose") {
    g.appendChild(svgElement("path",{
      d:"M-6 -2 Q-9 -12 1 -9 Q11 -5 5 5 Q0 10 -5 5 Q-10 0 -2 -4",
      fill:"#C4DDF5",
      stroke:"#FFFFFF",
      "stroke-opacity":".5"
    }));
  }

  return g;
}


function createStem(f) {

  const stem = svgElement("path",{
    class:"stem",
    d:`M300 480 Q${(300+f.x)/2+15} ${(480+f.y)/2+20} ${f.x} ${f.y+15}`,
    stroke:"url(#stemColor)"
  });

  document.getElementById("stems").appendChild(stem);
}


function makeBabyBreath() {

  const layer = document.getElementById("baby");

  const branches = [
    [145,305],[165,290],[200,185],[235,205],
    [365,170],[405,205],[450,315],[425,335],
    [250,300],[335,290],[390,300],[180,235]
  ];

  branches.forEach(([x,y],i) => {

    for(let j=0;j<3;j++) {

      const dot = svgElement("circle",{
        cx:x+(j-1)*9,
        cy:y+(j%2)*8,
        r:3.5,
        fill:"#FFFFFF",
        opacity:".95",
        class:"flower"
      });

      dot.dataset.delay=7.8+i*.08;

      layer.appendChild(dot);
    }
  });
}


function buildBouquet() {

  const stems = document.getElementById("stems");
  const flowerLayer = document.getElementById("flowers");

  flowers.forEach(f => {

    createStem(f);

    const flower = makeFlower(f);
    flower.dataset.delay=f.delay;

    flowerLayer.appendChild(flower);

  });

  makeBabyBreath();
}


/* BACKGROUND MUSIC */

const song = document.getElementById("song");

song.volume = 0.65;

async function startMusic() {
  if (!song.paused) return;

  try {
    await song.play();
  } catch(error) {
    // Browser blocks autoplay until user interaction.
  }
}

// Attempt autoplay when the website opens.
startMusic();

// If autoplay is blocked, the first touch anywhere starts the song.
document.addEventListener("pointerdown", startMusic, {
  once: true
});

document.addEventListener("keydown", startMusic, {
  once: true
});


/* STARS */

function createStars() {

  const container = document.getElementById("stars");

  for(let i=0;i<65;i++) {

    const star = document.createElement("span");

    star.className="star";
    star.textContent=i%3===0 ? "✦" : "·";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.setProperty(
      "--duration",
      (2+Math.random()*4)+"s"
    );

    star.style.animationDelay=Math.random()*4+"s";
    star.style.fontSize=(5+Math.random()*10)+"px";

    container.appendChild(star);
  }
}


/* FLOATING PETALS */

function floatingPetals() {

  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  setInterval(() => {

    const petal=document.createElement("div");

    petal.className="petal";

    petal.textContent=["✧","·","❋","♡"][
      Math.floor(Math.random()*4)
    ];

    petal.style.left=Math.random()*100+"vw";
    petal.style.bottom="-15px";

    petal.style.fontSize=(9+Math.random()*12)+"px";

    petal.style.setProperty(
      "--x",
      (Math.random()*140-70)+"px"
    );

    petal.style.animationDuration=(7+Math.random()*7)+"s";

    document.body.appendChild(petal);

    setTimeout(() => petal.remove(),15000);

  },1300);
}


/* FLOWER REVEAL */

function reveal() {

  document.querySelectorAll(".stem").forEach((stem,i) => {

    setTimeout(() => {
      stem.classList.add("show");
    },800+i*100);

  });

  document.querySelectorAll(".flower").forEach(flower => {

    const delay=parseFloat(flower.dataset.delay||2)*1000;

    setTimeout(() => {
      flower.classList.add("show");
    },delay);

  });

  setTimeout(() => {
    document.getElementById("ribbon").classList.add("show");
  },8200);

  setTimeout(() => {
    document.getElementById("message").classList.add("show");
  },9500);
}


/* PERSONAL MESSAGE */

document.getElementById("recipient").textContent =
  giftConfig.recipient;

document.getElementById("personal").textContent =
  giftConfig.message;

document.getElementById("sender").textContent =
  giftConfig.sender;


/* START WEBSITE */

buildBouquet();
createStars();
floatingPetals();
reveal();

</script>

</body>
</html>
