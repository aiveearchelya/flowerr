
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet Just For You ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --navy: #071323;
  --blue: #83B2DF;
  --powder: #B7D5F2;
  --ice: #DFEDFC;
  --white: #FFFFFF;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 42%, #193451 0%, #0B1C30 42%, #050C17 100%);
  color: white;
  font-family: 'DM Sans', sans-serif;
}

#scene {
  position: relative;
  min-height: 100svh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.glow {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: #83B2DF;
  filter: blur(120px);
  opacity: .13;
  animation: glow 6s ease-in-out infinite alternate;
}

@keyframes glow {
  from { transform: scale(.85); opacity:.08; }
  to { transform: scale(1.2); opacity:.19; }
}

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  color: #C8E4FF;
  animation: twinkle var(--duration) ease-in-out infinite alternate;
  opacity: .3;
}

@keyframes twinkle {
  from { opacity:.12; transform: scale(.7); }
  to { opacity:.85; transform: scale(1.3); }
}

.content {
  position: relative;
  z-index: 2;
  width: min(100%, 650px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.intro {
  font-size: 10px;
  letter-spacing: 5px;
  color: #A9C9E8;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeIn 2s 1s forwards;
}

#bouquet {
  width: min(100%, 540px);
  height: auto;
  overflow: visible;
  margin: 5px 0 -5px;
  filter: drop-shadow(0 15px 35px #0008);
}

.flower {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
}

.flower.show {
  animation: bloom .9s cubic-bezier(.2,.8,.2,1) forwards,
             sway 5s ease-in-out infinite 1s;
}

@keyframes bloom {
  from {
    opacity: 0;
    scale: .15;
  }
  to {
    opacity: 1;
    scale: 1;
  }
}

@keyframes sway {
  0%,100% { rotate: -1.2deg; }
  50% { rotate: 1.2deg; }
}

.stem {
  stroke: #789E91;
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
}

.stem.show {
  animation: grow 1.8s ease forwards;
}

@keyframes grow {
  to { stroke-dashoffset: 0; }
}

.leaf {
  fill: #7FAD9E;
  opacity: .9;
}

#ribbon {
  opacity: 0;
}

#ribbon.show {
  animation: fadeIn 1.2s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

#bouquet {
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-11px); }
}

.message {
  opacity: 0;
  transform: translateY(12px);
  transition: 1.5s ease;
  margin-top: -3px;
}

.message.show {
  opacity: 1;
  transform: translateY(0);
}

.recipient {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 6vw, 38px);
  font-weight: 400;
  color: #D5E9FC;
  margin: 0 0 12px;
}

.personal {
  font-family: 'Playfair Display', serif;
  font-size: clamp(15px, 3.5vw, 19px);
  font-style: italic;
  line-height: 1.8;
  color: #E9F1FA;
  max-width: 380px;
  margin: 0 auto 15px;
}

.sender {
  color: #A9C9E8;
  font-size: 12px;
  letter-spacing: 2px;
}

.replay {
  margin-top: 25px;
  border: 1px solid #A9C9E855;
  color: #D8E9F9;
  background: #A9C9E811;
  padding: 10px 24px;
  border-radius: 30px;
  font: inherit;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: .3s;
}

.replay:hover {
  background: #A9C9E833;
  border-color: #A9C9E8;
}

.petal {
  position: absolute;
  pointer-events: none;
  color: #C9E3FA;
  animation: drift linear forwards;
  opacity: 0;
}

@keyframes drift {
  0% { opacity:0; transform:translate(0,0) rotate(0deg); }
  15% { opacity:.8; }
  100% { opacity:0; transform:translate(var(--x),-110vh) rotate(300deg); }
}

@media(max-width:480px) {
  .content { padding: 12px; }
  #bouquet { width: 112%; max-width: none; }
  .intro { letter-spacing: 3px; }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div id="scene">
  <div class="glow"></div>
  <div class="stars" id="stars"></div>

  <main class="content">

    <div class="intro">A LITTLE SOMETHING FOR YOU</div>

    <svg id="bouquet" viewBox="0 0 600 610"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <radialGradient id="bluePetal">
          <stop offset="0%" stop-color="#E5F2FF"/>
          <stop offset="65%" stop-color="#B7D5F2"/>
          <stop offset="100%" stop-color="#6D9FCE"/>
        </radialGradient>

        <radialGradient id="deepPetal">
          <stop offset="0%" stop-color="#E1F0FF"/>
          <stop offset="65%" stop-color="#91BCE5"/>
          <stop offset="100%" stop-color="#4779B2"/>
        </radialGradient>

        <radialGradient id="whitePetal">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#DCE8F3"/>
        </radialGradient>

        <linearGradient id="stemColor" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#B1D4C1"/>
          <stop offset="100%" stop-color="#547E75"/>
        </linearGradient>
      </defs>

      <!-- STEMS -->
      <g id="stems"></g>

      <!-- LEAVES -->
      <g id="leaves">
        <path class="leaf" d="M300 420 Q220 365 192 385 Q232 440 300 420"/>
        <path class="leaf" d="M302 390 Q360 330 410 345 Q370 405 302 390"/>
        <path class="leaf" d="M288 460 Q220 420 190 445 Q235 485 288 460"/>
        <path class="leaf" d="M315 440 Q390 390 435 410 Q390 460 315 440"/>
        <path class="leaf" d="M285 370 Q250 320 225 330 Q245 375 285 370"/>
      </g>

      <!-- FLOWERS -->
      <g id="flowers"></g>

      <!-- BABY'S BREATH -->
      <g id="baby"></g>

      <!-- BOUQUET WRAPPING -->
      <g id="wrapping">
        <path d="M180 390 Q300 450 420 390 L365 570 Q300 590 235 570 Z"
          fill="#B5D2ED" opacity=".88"/>
        <path d="M180 390 Q300 450 420 390 L365 570 Q300 590 235 570 Z"
          fill="none" stroke="#E1EDFA" stroke-width="2" opacity=".6"/>
        <path d="M220 425 Q300 475 380 425"
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".4"/>
      </g>

      <!-- BLUE RIBBON -->
      <g id="ribbon">
        <path d="M300 465 C245 415 205 450 267 490 L300 472"
          fill="#83B2DF" stroke="#D5E9FC" stroke-width="2"/>
        <path d="M300 465 C355 415 395 450 333 490 L300 472"
          fill="#A9C9E8" stroke="#D5E9FC" stroke-width="2"/>
        <path d="M300 465 L278 540 L305 530 L322 470"
          fill="#7FAAD4" stroke="#D5E9FC" stroke-width="1.5"/>
        <circle cx="300" cy="465" r="9" fill="#E5EFF8"/>
      </g>

    </svg>

    <section class="message" id="message">
      <h1 class="recipient" id="recipient"></h1>
      <p class="personal" id="personal"></p>
      <div class="sender" id="sender"></div>
      <button class="replay" onclick="replay()">WATCH AGAIN ♡</button>
    </section>

  </main>
</div>

<script>

/* =================================
   EDIT YOUR PERSONAL GIFT HERE
================================= */

const giftConfig = {
  recipient: "Someone Special",
  sender: "With love, Your Name",
  message: "I may not be there to give you flowers, but I made this little bouquet just for you. ♡"
};

/* =================================
   FLOWER DATA
================================= */

const svgNS = "http://www.w3.org/2000/svg";

const flowers = [
  { type:"lily", x:160, y:170, color:"url(#bluePetal)", delay:2.2 },
  { type:"rose", x:245, y:125, color:"url(#deepPetal)", delay:2.8 },
  { type:"lily", x:340, y:105, color:"url(#bluePetal)", delay:3.4 },
  { type:"rose", x:430, y:165, color:"url(#deepPetal)", delay:4.0 },
  { type:"rose", x:115, y:265, color:"url(#bluePetal)", delay:4.5 },
  { type:"daisy", x:210, y:250, color:"url(#whitePetal)", delay:5.0 },
  { type:"rose", x:305, y:220, color:"url(#bluePetal)", delay:5.4 },
  { type:"peony", x:390, y:270, color:"url(#whitePetal)", delay:5.8 },
  { type:"lily", x:485, y:270, color:"url(#deepPetal)", delay:6.2 },
  { type:"rose", x:180, y:335, color:"url(#deepPetal)", delay:6.6 },
  { type:"daisy", x:280, y:330, color:"url(#whitePetal)", delay:7.0 },
  { type:"rose", x:370, y:350, color:"url(#bluePetal)", delay:7.4 }
];

function element(name, attrs={}) {
  const el = document.createElementNS(svgNS,name);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}

function makeFlower(f) {
  const g = element("g",{
    class:"flower",
    transform:`translate(${f.x} ${f.y})`
  });

  const count = f.type==="lily" ? 6 :
                f.type==="daisy" ? 12 :
                f.type==="peony" ? 18 : 10;

  for(let i=0;i<count;i++) {
    const angle = i * 360/count;
    let rx,ry,fill;

    if(f.type==="lily") {
      rx=13; ry=33; fill=f.color;
    } else if(f.type==="daisy") {
      rx=7; ry=22; fill="url(#whitePetal)";
    } else if(f.type==="peony") {
      rx=12; ry=24; fill="url(#whitePetal)";
    } else {
      rx=12; ry=22;
      fill=i%2===0 ? f.color : "url(#bluePetal)";
    }

    const petal=element("ellipse",{
      cx:0, cy:-ry+5, rx, ry,
      fill,
      transform:`rotate(${angle})`,
      stroke:"#FFFFFF",
      "stroke-opacity":".15",
      "stroke-width":".8"
    });

    g.appendChild(petal);
  }

  const centerColor = f.type==="daisy" ? "#E8DDA7" :
                      f.type==="peony" ? "#F7F4EB" :
                      f.type==="rose" ? "#91B8DD" : "#D8E9F7";

  const center=element("circle",{
    cx:0,cy:0,r:f.type==="rose"?11:9,
    fill:centerColor,
    stroke:"#FFFFFF",
    "stroke-opacity":".5",
    "stroke-width":"1.5"
  });

  g.appendChild(center);

  if(f.type==="rose") {
    const inner=element("path",{
      d:"M-6 -2 Q-9 -12 1 -9 Q11 -5 5 5 Q0 10 -5 5 Q-10 0 -2 -4",
      fill:"#C4DDF5",
      stroke:"#FFFFFF",
      "stroke-opacity":".5"
    });
    g.appendChild(inner);
  }

  return g;
}

function createStem(f) {
  const stem=element("path",{
    class:"stem",
    d:`M300 480 Q${(300+f.x)/2+15} ${(480+f.y)/2+20} ${f.x} ${f.y+15}`,
    stroke:"url(#stemColor)"
  });
  document.getElementById("stems").appendChild(stem);
  return stem;
}

function makeBabyBreath() {
  const g=document.getElementById("baby");

  const branches=[
    [145,305],[165,290],[200,185],[235,205],
    [365,170],[405,205],[450,315],[425,335],
    [250,300],[335,290],[390,300],[180,235]
  ];

  branches.forEach(([x,y],i)=>{
    for(let j=0;j<3;j++){
      const dot=element("circle",{
        cx:x+(j-1)*9,
        cy:y+(j%2)*8,
        r:3.5,
        fill:"#FFFFFF",
        opacity:".95"
      });
      dot.classList.add("flower");
      dot.dataset.delay=7.8+i*.08;
      g.appendChild(dot);
    }
  });
}

/* =================================
   BUILD BOUQUET
================================= */

function buildBouquet() {
  const flowerLayer=document.getElementById("flowers");
  const stemLayer=document.getElementById("stems");

  flowerLayer.innerHTML="";
  stemLayer.innerHTML="";

  flowers.forEach(f=>{
    const stem=createStem(f);
    const flower=makeFlower(f);
    flower.dataset.delay=f.delay;
    flowerLayer.appendChild(flower);
  });

  makeBabyBreath();
}

/* =================================
   STARS
================================= */

function createStars() {
  const container=document.getElementById("stars");
  container.innerHTML="";

  for(let i=0;i<65;i++){
    const s=document.createElement("span");
    s.className="star";
    s.innerHTML=i%3===0?"✦":"·";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.setProperty("--duration",(2+Math.random()*4)+"s");
    s.style.animationDelay=Math.random()*4+"s";
    s.style.fontSize=(5+Math.random()*10)+"px";
    container.appendChild(s);
  }
}

/* =================================
   FLOATING PETALS
================================= */

function floatingPetals() {
  setInterval(()=>{
    const p=document.createElement("div");
    p.className="petal";
    p.innerHTML=["✧","·","❋","♡"][Math.floor(Math.random()*4)];
    p.style.left=Math.random()*100+"%";
    p.style.bottom="-15px";
    p.style.fontSize=(9+Math.random()*12)+"px";
    p.style.setProperty("--x",(Math.random()*140-70)+"px");
    p.style.animationDuration=(7+Math.random()*7)+"s";

    document.getElementById("scene").appendChild(p);
    setTimeout(()=>p.remove(),15000);
  },1000);
}

/* =================================
   REVEAL ANIMATION
================================= */

let timers=[];

function clearTimers(){
  timers.forEach(clearTimeout);
  timers=[];
}

function later(fn,delay){
  const t=setTimeout(fn,delay);
  timers.push(t);
}

function reveal() {
  clearTimers();

  document.querySelectorAll(".flower").forEach(f=>{
    f.classList.remove("show");
  });

  document.querySelectorAll(".stem").forEach(s=>{
    s.classList.remove("show");
  });

  document.getElementById("ribbon").classList.remove("show");
  document.getElementById("message").classList.remove("show");

  const stems=[...document.querySelectorAll(".stem")];
  stems.forEach((s,i)=>{
    later(()=>s.classList.add("show"),800+i*100);
  });

  const blossoms=[...document.querySelectorAll(".flower")];

  blossoms.forEach(f=>{
    const delay=parseFloat(f.dataset.delay||2)*1000;
    later(()=>f.classList.add("show"),delay);
  });

  later(()=>{
    document.getElementById("ribbon").classList.add("show");
  },8200);

  later(()=>{
    document.getElementById("message").classList.add("show");
  },9500);
}

function replay(){
  reveal();
}

/* =================================
   PERSONAL MESSAGE
================================= */

document.getElementById("recipient").textContent=
  giftConfig.recipient;

document.getElementById("personal").textContent=
  giftConfig.message;

document.getElementById("sender").textContent=
  giftConfig.sender;

/* =================================
   START
================================= */

createStars();
buildBouquet();
floatingPetals();
reveal();

</script>

</body>
</html>
